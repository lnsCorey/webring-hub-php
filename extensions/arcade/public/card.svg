<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120724"/>
      <stop offset="100%" stop-color="#070411"/>
    </linearGradient>
    <linearGradient id="marquee" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1b3a"/>
      <stop offset="100%" stop-color="#190a2e"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <!-- Subtle perspective floor grid -->
  <g stroke="#ff2bd6" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="168" x2="320" y2="168"/>
    <line x1="0" y1="184" x2="320" y2="184"/>
    <line x1="40" y1="156" x2="0" y2="200"/>
    <line x1="100" y1="156" x2="64" y2="200"/>
    <line x1="160" y1="156" x2="160" y2="200"/>
    <line x1="220" y1="156" x2="256" y2="200"/>
    <line x1="280" y1="156" x2="320" y2="200"/>
  </g>
  <!-- Scattered retro carpet accents -->
  <g fill="none" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <polyline points="24,38 32,30 40,38 48,30" stroke="#00f0ff"/>
    <polygon points="274,36 286,52 262,52" stroke="#ffe600"/>
    <circle cx="48" cy="118" r="6" stroke="#ff2bd6"/>
    <polyline points="266,112 276,104 286,112 296,104" stroke="#ff2bd6"/>
    <circle cx="282" cy="144" r="5" stroke="#00f0ff"/>
  </g>
  <!-- Arcade cabinet silhouette -->
  <g transform="translate(88, 16)">
    <!-- Outer cabinet -->
    <path d="M16,4 L128,4 L138,34 L132,114 L144,132 L144,168 L0,168 L0,132 L12,114 L6,34 Z"
          fill="#17102c" stroke="#ff2bd6" stroke-width="2.5"/>
    <!-- Lit marquee header -->
    <rect x="18" y="10" width="108" height="22" rx="3" fill="#090514" stroke="url(#marquee)" stroke-width="2"/>
    <text x="72" y="25" text-anchor="middle" fill="#ffe600" font-family="monospace" font-weight="bold" font-size="13" letter-spacing="3">ARCADE</text>
    <!-- CRT bezel & screen -->
    <rect x="18" y="40" width="108" height="68" rx="6" fill="#070a14" stroke="#00f0ff" stroke-width="2"/>
    <rect x="24" y="46" width="96" height="56" rx="4" fill="url(#screen)"/>
    <!-- Retro vector game scene inside CRT -->
    <polygon points="72,60 80,74 72,70 64,74" fill="#00f0ff"/>
    <circle cx="48" cy="64" r="5" fill="none" stroke="#ff2bd6" stroke-width="2"/>
    <circle cx="98" cy="68" r="6" fill="none" stroke="#ffe600" stroke-width="2"/>
    <line x1="72" y1="54" x2="72" y2="49" stroke="#ffe600" stroke-width="2"/>
    <rect x="34" y="88" width="76" height="4" rx="2" fill="#ff2bd6" opacity="0.7"/>
    <!-- Control deck -->
    <path d="M12,114 L132,114 L140,132 L4,132 Z" fill="#231645" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Joystick -->
    <line x1="42" y1="124" x2="42" y2="112" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="42" cy="110" r="5.5" fill="#ff2bd6"/>
    <!-- Arcade buttons -->
    <circle cx="88" cy="123" r="4.5" fill="#00f0ff"/>
    <circle cx="102" cy="120" r="4.5" fill="#ffe600"/>
    <circle cx="115" cy="124" r="4.5" fill="#ff2bd6"/>
    <!-- Coin door -->
    <rect x="48" y="140" width="48" height="22" rx="2" fill="#0d081c" stroke="#64748b" stroke-width="1.5"/>
    <rect x="57" y="145" width="10" height="12" rx="1" fill="#ff2bd6" opacity="0.85"/>
    <rect x="77" y="145" width="10" height="12" rx="1" fill="#ff2bd6" opacity="0.85"/>
  </g>
</svg>
