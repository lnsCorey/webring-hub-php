# Example nginx server block for webring-hub-php
# Point `root` at `public/` so `src/`, `data/`, `sql/`, `config.php`, and `extensions/` stay outside the web root.

server {
    listen 443 ssl http2;
    server_name hub.example.com;

    root /var/www/webring-hub-php/public;
    index index.php;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Block dotfiles except /.well-known/did.json (routed to index.php)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Don't pass a client "Proxy:" header into PHP as HTTP_PROXY (httpoxy).
        fastcgi_param HTTP_PROXY "";
        # Don't reveal the PHP version (also set expose_php = Off in php.ini).
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ \.php$ {
        return 404;
    }
}
